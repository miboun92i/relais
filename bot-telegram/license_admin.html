<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relais — licences</title>
<link rel="stylesheet" href="/license_admin.css"><body><main><h1>Relais — administration des licences</h1><form id="login"><label>Identifiant <input name="username" autocomplete="username" required></label><label>Mot de passe <input name="password" type="password" autocomplete="current-password" required></label><button>Connexion</button></form>
<section id="admin" hidden><h2>Créer une licence</h2><form id="issue"><label>Client <input name="customer" required maxlength="100"></label><label>Durée en jours <input name="days" type="number" min="1" max="3660" value="30" required></label><label>Comptes <input name="accounts" type="number" min="1" max="100" value="1" required></label><button>Créer</button></form><p>Copiez la licence et placez-la dans LICENSE_TOKEN du service client.</p><textarea id="license" rows="5" cols="80" readonly aria-label="Licence créée"></textarea><h2>Licences et installations</h2><button id="refresh">Actualiser</button><button id="logout">Fermer la session locale</button><div id="list"></div></section><p id="message" role="status"></p></main><script src="/license_admin.js"></script></body></html>
